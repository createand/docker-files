services:
  playwright-runner:
    build: .
    container_name: playwright_qaops_runner
    #command: npx playwright show-report --host 0.0.0.0 --port 9323
    #command: sh -c "npx playwright test; npx playwright show-report --host 0.0.0.0 --port 9323"
    command: sh -c "rm -rf /usr/app/playwright-report/*; npx playwright test; npx playwright show-report --host 0.0.0.0 --port 9323"
    ports:
      - "9323:9323"
    volumes:
      - playwright_results:/usr/app/test-results
      - playwright_report:/usr/app/playwright-report
    restart: "no"
    deploy:
      resources:
         limits:
           memory: 3g

volumes:
  playwright_report:
  playwright_results:
