version: '3.8'

services:
  registry:
    image: registry:2
    container_name: local-registry
    ports:
      - "5000:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_HEADERS_ACCESS-CONTROL-ALLOW-ORIGIN: '["http://192.168.64.39:8080"]'
      REGISTRY_HTTP_HEADERS_ACCESS-CONTROL-ALLOW-METHODS: '["HEAD", "GET", "OPTIONS", "DELETE", "POST", "PUT"]'
      REGISTRY_HTTP_HEADERS_ACCESS-CONTROL-ALLOW-HEADERS: '["Authorization", "Content-Type", "X-Requested-With"]'
      REGISTRY_HTTP_HEADERS_ACCESS-CONTROL-EXPOSE-HEADERS: '["Docker-Content-Digest"]'
    volumes:
      - ./registry_data:/var/lib/registry
    restart: always

  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: local-registry-ui
    ports:
      - "8080:80"
    environment:
      - REGISTRY_TITLE=İrfan'ın Özel Docker Hub'ı
      - REGISTRY_URL=http://192.168.64.39:5000 # UI'ın bağlanacağı dış IP adresini yazdık kanka
      - SINGLE_REGISTRY=true
      - DELETE_IMAGES=true
    depends_on:
      - registry
    restart: always
